spring:
  application:
    name: PlanningService
    base-url: /api/v1/books
  datasource:
    url: jdbc:postgresql://localhost:5436/main_db
    username: postgres
    password: 3030
    driver-class-name: org.postgresql.Driver
    simple-insert:
      user-book:
        schema: public
        table: users_books
  flyway:
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: false
    baseline-version: 1
    baseline-on-migrate: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        transaction:
          jta:
            platform: none
    database: postgresql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispass123}
      database: 3
      timeout: 10s
      connect-timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
        shutdown-timeout: 100ms
      book:
        ttl: 43200
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    connection-timeout: 5000
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 2.0
    queue:
      name: planning.from_book_service.queue
      message:
        ttl: 70000
      exchange:
        name: planning.from_book_service.exchange
      routing:
        key: planning.from_book_service.routing.key

user-service:
  api:
    internal:
      base-url: http://localhost:8080/api/v1/users/internal
    retry-name: userServiceRetry

server:
  forward-headers-strategy: framework
  port: 8084
eureka:
  instance:
    leaseRenewalIntervalInSeconds: 1
    leaseExpirationDurationInSeconds: 1
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registryFetchIntervalSeconds: 1

internal:
  code: ${INTERNAL_CODE}


logging:
  file:
    path: ./logs/planningService
    name: ${logging.file.path}/planningService.log
  level:
    root: info
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 10
      total-size-cap: 5GB
      file-name-pattern: ${logging.file.path}/archived/planningService.%d{yyyy-MM-dd}.%i.log
  pattern:
    console: '%d{dd.MM.yyyy HH:mm:ss.SSS} [%thread] %clr(%-5level) %logger{36} - %msg%n'
    file: '%d{dd.MM.yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
