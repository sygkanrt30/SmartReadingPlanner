spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispass123}
      timeout: 10s
      connect-timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
        shutdown-timeout: 100ms
  cloud:
    gateway:
      rate-limiter:
        enabled: true
        fail-open: true
        per-endpoint: true
        per-user: true
        default-max-requests: 100
        default-window-millis: 60000
        excluded-paths:
          - "^/actuator/health$"
          - "^/actuator/info$"
        auth-path: "/api/v1/users/auth/"
      server:
        webflux:
          default-filters:
            - name: JwtAuthFilter
              args:
                excludePaths:
                  - /api/v1/users/auth/**
                  - /actuator/**
          routes:
            - id: user-service
              uri: lb://UserService
              predicates:
                - Path=/api/v1/users/**
server:
  port: 8086
  forward-headers-strategy: framework
eureka:
  instance:
    leaseRenewalIntervalInSeconds: 1
    leaseExpirationDurationInSeconds: 1
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registryFetchIntervalSeconds: 1

jwt:
  cookie-token-key: '{"kty":"oct","k":"956PBFst1FguLr5irJD-aQ"}'

logging:
  file:
    path: ./logs/api-gateway
    name: ${logging.file.path}/api-gateway.log
  level:
    root: info
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 10
      total-size-cap: 5GB
      file-name-pattern: ${logging.file.path}/archived/api-gateway.%d{yyyy-MM-dd}.%i.log
  pattern:
    console: '%d{dd.MM.yyyy HH:mm:ss.SSS} [%thread] %clr(%-5level) %logger{36} - %msg%n'
    file: '%d{dd.MM.yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
