version: '3.8'

services:
  db:
    image: postgres:17.5
    container_name: main_db
    restart: always
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3030
      POSTGRES_DB: main_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  general-network:
    driver: bridge

volumes:
  postgres_data: