version: '3.8'

services:
  db:
    image: postgres:17.5
    container_name: main_db
    restart: always
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3030
      POSTGRES_DB: main_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_for_rate_limit:
    image: redis:7.2-alpine
    container_name: redis-rate-limit
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-redispass123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass123}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - general-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispass123}

networks:
  general-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: